name: CI

on:
  push:
    branches-ignore:
      - main # main is protected — tests run via PR, not direct push
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Must match publish.yml — the bot runs on 3.12 in production
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Type check
        run: uv run mypy

      - name: Tests
        # -m "not live" excludes canary tests that hit the real news sites;
        # those run on a schedule in canary.yml instead.
        run: uv run pytest -q -m "not live"
