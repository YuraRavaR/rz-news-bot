# Updates arrive as PRs against stage, never the protected main. Dependabot reads
# this file from the default branch, so it only takes effect after a release.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    target-branch: stage
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: stage
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
