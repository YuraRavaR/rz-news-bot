# Fixtures are frozen copies of live pages and stay byte-for-byte as fetched.
exclude: ^tests/fixtures/

repos:
  # ruff and mypy run through uv, so their versions come from uv.lock and always
  # match CI. `uv run --frozen` never rewrites the lockfile from a hook.
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        # Checks the whole package as configured in pyproject, not just staged files
        entry: uv run --frozen mypy
        language: system
        types: [python]
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: no-commit-to-branch
        args: [--branch, main]
